<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CL4R1T4S Prompt Archive</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--bd:#ddd;--side:#f6f6f4;--acc:#c15f3c}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--fg:#eee;--mut:#999;--bd:#333;--side:#1e1e1c;--acc:#e08a67}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;height:100vh}
aside{width:320px;border-right:1px solid var(--bd);background:var(--side);display:flex;flex-direction:column}
aside input{margin:12px;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}
#list{overflow:auto;flex:1;padding:0 8px 16px}
h3{margin:14px 6px 4px;font-size:11px;letter-spacing:.08em;color:var(--mut)}
a.f{display:block;padding:5px 8px;border-radius:5px;color:var(--fg);text-decoration:none;font-size:13px;word-break:break-word}
a.f:hover{background:var(--bd)}a.f.on{background:var(--acc);color:#fff}
main{flex:1;overflow:auto;padding:24px 32px}
pre{white-space:pre-wrap;word-break:break-word;font:12.5px/1.55 ui-monospace,monospace;margin:0}
.bar{display:flex;gap:12px;align-items:center;margin-bottom:16px;color:var(--mut)}
.bar a{color:var(--acc)}
@media(max-width:700px){body{flex-direction:column}aside{width:100%;height:40vh}}
</style>
</head>
<body>
<aside><input id="q" placeholder="Search files…" autofocus><div id="list"></div></aside>
<main><div id="view"><h2>CL4R1T4S</h2><p>Select a file from the sidebar.</p></div></main>
<script>
(async()=>{
const list=document.getElementById('list'),view=document.getElementById('view'),q=document.getElementById('q');
const items=await (await fetch('manifest.json')).json();
function render(f=''){
  list.innerHTML='';let last='';
  items.filter(i=>(i.vendor+' '+i.name).toLowerCase().includes(f.toLowerCase())).forEach(i=>{
    if(i.vendor!==last){const h=document.createElement('h3');h.textContent=i.vendor;list.appendChild(h);last=i.vendor}
    const a=document.createElement('a');a.className='f';a.textContent=i.name;a.href='#'+encodeURIComponent(i.path);
    list.appendChild(a);
  });
}
async function open(){
  const p=decodeURIComponent(location.hash.slice(1));if(!p)return;
  document.querySelectorAll('a.f').forEach(a=>a.classList.toggle('on',decodeURIComponent(a.hash.slice(1))===p));
  view.innerHTML='<p>Loading…</p>';
  const t=await (await fetch(p.split('/').map(encodeURIComponent).join('/'))).text();
  view.innerHTML='';
  const bar=document.createElement('div');bar.className='bar';
  bar.innerHTML='<strong></strong><a target="_blank">raw</a>';
  bar.firstChild.textContent=p.replace('prompts/','');
  bar.lastChild.href=p.split('/').map(encodeURIComponent).join('/');
  const pre=document.createElement('pre');pre.textContent=t;
  view.append(bar,pre);
}
q.oninput=()=>{render(q.value);open()};
window.onhashchange=open;render();open();
})();
</script>
</body>
</html>
